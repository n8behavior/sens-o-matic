[package]
name = "e2e-openmls"
version = "0.0.0"
edition = "2024"
description = "MLS (RFC 9420) with OpenMLS behind GroupCipher: the candidate of D9 of #61"
license = "MIT"
publish = false

# Its own workspace, so that the root Cargo.toml, `just check` and the CI job
# `Check` do not see this crate.
[workspace]

[dependencies]
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc"] }
e2e-harness = { path = "../harness" }
ed25519-dalek = "3.0.0"
hkdf = "0.13.0"
hmac = "0.13.0"
openmls = "=0.9.2"
openmls_memory_storage = "=0.6.0"
openmls_traits = "=0.6.0"
rand = "0.9.5"
sha2 = "0.11.1"
thiserror = "2.0.18"
tls_codec = "0.5.0"
x25519-dalek = "3.0.0"

[dev-dependencies]
# The stock provider, to check the HPKE of `provider` against `hpke-rs`.
openmls_rust_crypto = "=0.6.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
wildcard_enum_match_arm = "warn"

# The signatures of a run of 90 devices are slow without optimization. Only the
# dependencies are optimized, so this crate stays easy to debug.
[profile.dev.package."*"]
opt-level = 3

# The build for `wasm32-unknown-unknown` needs two features that no code of this
# crate asks for: `js` of OpenMLS (its time, `web-time`) and `wasm_js` of
# `getrandom 0.3`, which `rand` of the harness pulls in for its OS generator (the
# library never calls it; `clippy.toml` refuses the call). `cargo check` passes
# with them and no other flag; code that did call the OS generator would also
# need `RUSTFLAGS='--cfg getrandom_backend="wasm_js"'`. See the answers of #69,
# question 6.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
openmls = { version = "=0.9.2", features = ["js"] }
