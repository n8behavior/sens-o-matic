[package]
name = "e2e-harness"
version = "0.0.0"
edition = "2024"
description = "The simulator, the log, the evil server and the scenarios of the E2E spike (D5 of #61)"
license = "MIT"
publish = false

# Its own workspace, so that the root Cargo.toml, `just check` and the CI job
# `Check` do not see this crate.
[workspace]

[dependencies]
ed25519-dalek = "3.0.0"
rand = "0.9.5"
rand_chacha = "0.9.0"
sha2 = "0.11.1"
thiserror = "2.0.18"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
wildcard_enum_match_arm = "warn"

# The signatures of a run of 90 devices are slow without optimization. Only the
# dependencies are optimized, so the harness stays easy to debug.
[profile.dev.package."*"]
opt-level = 3
