name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - uses: ./.github/actions/setup-mdbook
      - run: just check
      - name: Install hurl
        env:
          HURL_VERSION: "8.0.1"
          HURL_DEB_SHA256: e76e6c0957f83f9b761416452871554d0f068384b6cd004bff82dd8795c62225
        run: |
          curl -sSfL -o "$RUNNER_TEMP/hurl.deb" \
            "https://github.com/Orange-OpenSource/hurl/releases/download/${HURL_VERSION}/hurl_${HURL_VERSION}_amd64.deb"
          echo "${HURL_DEB_SHA256}  $RUNNER_TEMP/hurl.deb" | sha256sum -c -
          sudo apt-get install -y "$RUNNER_TEMP/hurl.deb"
          hurl --version
      - name: Hurl API suite
        run: just test-api
  image:
    name: Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: just image
      - name: Image size
        run: docker image ls sens-o-matic
      - name: Run the image
        run: docker run --detach --name server --publish 3000:3000 sens-o-matic
      - name: Wait for GET /health
        run: |
          for i in $(seq 1 30); do
            if reply=$(curl -sf http://localhost:3000/health); then
              echo "GET /health answered: $reply"
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' server)" != true ]; then
              break
            fi
            sleep 1
          done
          echo "::error::The image did not answer GET /health"
          docker logs server
          exit 1
