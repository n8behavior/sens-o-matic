name: Release
on:
  release:
    types: [published]
env:
  CARGO_TERM_COLOR: always
permissions:
  contents: write
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - uses: ./.github/actions/setup-mdbook
      - run: just validate-version ${{ github.event.release.tag_name }}
      - run: just check

  build-artifacts:
    name: Build Artifacts
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: just build-release
      - run: just package ${{ github.event.release.tag_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-tarball
          path: "*.tar.gz"

  publish-crate:
    name: Publish to crates.io
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: just publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  upload-artifacts:
    name: Upload Release Assets
    needs: build-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-tarball
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload ${{ github.event.release.tag_name }} *.tar.gz

  # ANCHOR: publish-image
  publish-image:
    name: Publish image to GHCR
    needs: validate
    runs-on: ubuntu-latest
    # Least privilege: this job alone writes the packages. A job-level
    # `permissions` replaces the top-level one, so it also names the read
    # that the checkout needs.
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/n8behavior/sens-o-matic
      TAG_NAME: ${{ github.event.release.tag_name }}
      PRERELEASE: ${{ github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: just validate-version "$TAG_NAME"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # `just image` builds the image that the job `Image` of ci.yml tests.
      - name: Build the image
        run: >-
          just image
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          --label org.opencontainers.image.revision=${{ github.sha }}
      # The tags are the version of the release (0.1.2 for v0.1.2) and
      # latest. A prerelease does not take latest.
      - name: Push the image
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          tags=("$version")
          if [ "$PRERELEASE" != true ]; then
            tags+=(latest)
          fi
          for tag in "${tags[@]}"; do
            docker tag sens-o-matic "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          digest=$(docker buildx imagetools inspect "$IMAGE:$version" --format '{{json .Manifest}}' | jq -r .digest)
          {
            echo "## Deploy image"
            echo
            echo "Pushed \`$IMAGE\` with the tags: ${tags[*]}"
            echo
            echo "Digest: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
  # ANCHOR_END: publish-image
